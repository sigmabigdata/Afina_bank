# ============================================================
# Афина · Источники CRL
# ============================================================
# Формат: <имя_файла>|<URL>
#
# ⚠️  URL CRL берутся ТОЛЬКО из сертификатов клиентов!
# Используй ./extract-crl-urls.sh client.cer
#
# Как добавить новый УЦ:
#   1. Возьми сертификат клиента (например, .cer)
#   2. ./extract-crl-urls.sh client.cer
#   3. Скопируй URL из "CRL Distribution Points"
#   4. Добавь строку ниже: myuc_2026.crl|http://crl.myuc.ru/file.crl
#   5. На сервере: ./update-crls.sh && docker compose ... restart app
#
# Пустые строки и строки, начинающиеся с # — игнорируются.
# Если CRL не скачивается — файл можно просто скопировать руками в crls/.
# ============================================================

# --- Контур ---
# URL можно взять: ./extract-crl-urls.sh <любой_сертификат_контура>.cer
# Пока используем файл, загруженный вручную (kontur-q-2025.crl)
# kontur-q-2025.crl|http://<сюда_вписать_реальный_URL_из_сертификата>

# --- ФНС ---
# fns-guc-2026.crl|http://cdp.tax.gov.ru/cdp/<hash>.crl

# --- Тензор ---
# tensor.crl|http://<URL_из_сертификата>

