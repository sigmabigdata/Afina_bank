spring:
  datasource:
    url: jdbc:h2:mem:ukep;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: localhost
    port: 25

app:
  mail:
    mode: log
  crl-path: ./kontur-q-2025.crl
