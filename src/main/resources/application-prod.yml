spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/ukep}
    username: ${DB_USER:ukep}
    password: ${DB_PASSWORD:ukep}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:smtp.yandex.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

app:
  mail:
    mode: ${MAIL_MODE:smtp}
    from: ${MAIL_FROM:noreply@example.com}
