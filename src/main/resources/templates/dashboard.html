<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Афина · Личный кабинет</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://www.cryptopro.ru/sites/default/files/products/cades/cadesplugin_api.js"></script>
</head>
<body>
<header class="app-header">
    <a th:href="@{/dashboard}" class="brand">
        <img src="/img/logo.png" alt="Афина" class="brand-logo">
    </a>
    <div class="header-user">
        <span th:text="${user.fullName}">Пользователь</span>
        <form method="post" th:action="@{/logout}" style="display:inline">
            <button class="btn-ghost btn-sm" type="submit">Выйти</button>
        </form>
    </div>
</header>

<main>
    <div th:if="${ok}" class="alert ok" th:text="${ok}"></div>
    <div th:if="${err}" class="alert err" th:text="${err}"></div>

    <h1>Мои документы</h1>

    <form class="upload-form" method="post" th:action="@{/documents/upload}"
          enctype="multipart/form-data">
        <input type="file" name="file" required/>
        <button type="submit">Загрузить</button>
    </form>

    <div class="docs-list">
        <div th:each="d : ${documents}" class="doc-card" th:attr="data-id=${d.id}">
            <div class="doc-row">
                <div class="doc-name" th:text="${d.originalName}">file.pdf</div>
                <div class="doc-meta">
                    <span th:text="${#numbers.formatDecimal(d.size/1024.0,1,1)} + ' KB'">0</span>
                    <span>·</span>
                    <span th:text="${#temporals.format(d.uploadedAt,'dd.MM.yyyy HH:mm')}">—</span>
                    <span th:if="${d.signed}" class="badge ok">Подписан</span>
                    <span th:unless="${d.signed}" class="badge warn">Не подписан</span>
                </div>
                <div class="actions">
                    <a th:href="@{'/documents/' + ${d.id} + '/view'}" target="_blank" title="Просмотреть">👁</a>
                    <a th:href="@{'/documents/' + ${d.id} + '/download'}" title="Скачать">⬇</a>
                    <button th:if="${not d.signatures.?[signerUser != null and signerUser.id == user.id].size() > 0}"
                            type="button" class="btn-sign" th:attr="data-id=${d.id}" title="Подписать">✍</button>
                    <form th:unless="${d.signed}" method="post" th:action="@{'/documents/' + ${d.id} + '/delete'}"
                          onsubmit="return confirm('Удалить документ?')" style="display:inline">
                        <button type="submit" class="link danger" title="Удалить">🗑</button>
                    </form>
                </div>
            </div>

            <div th:if="${not #lists.isEmpty(d.signatures)}" class="sig-block">
                <div class="sig-icon">✓</div>
                <div class="sig-info">
                    <div class="sig-title">
                        Подписи: <span th:text="${#lists.size(d.signatures)}">0</span>
                    </div>
                    <div th:each="sig, st : ${d.signatures}" class="sig-item">
                        <div class="sig-subject">
                            <span th:text="${st.index + 1} + '. '">1. </span>
                            <span th:text="${sig.signerSubject}">ФИО</span>
                        </div>
                        <div class="sig-meta">
                            <span th:text="${#temporals.format(sig.signedAt,'dd.MM.yyyy HH:mm')}">—</span>
                            <span> · </span>
                            <span th:text="'serial=' + ${sig.signerSerial}">—</span>
                        </div>
                        <div class="sig-actions">
                            <a th:href="@{'/documents/' + ${d.id} + '/signatures/' + ${sig.id} + '/download'}"
                               class="btn-sig">⬇ .sig</a>
                            
                        </div>
                    </div>
                </div>
            </div>

        <div th:if="${#lists.isEmpty(documents)}" class="empty">
            Документов пока нет. Загрузите первый документ выше.
        </div>
    </div>
</main>

<script type="module" th:src="@{/js/sign.js}"></script>
</body>
</html>
