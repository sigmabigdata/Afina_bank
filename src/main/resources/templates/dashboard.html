
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script src="https://www.cryptopro.ru/sites/default/files/products/cades/cadesplugin_api.js"></script>
</head>
<body>
<header>
    <div class="brand">УКЭП Сервис</div>
    <div class="user">
        <span th:text="${user.fullName}">Пользователь</span>
        <form method="post" th:action="@{/logout}" style="display:inline">
            <button class="link" type="submit">Выйти</button>
        </form>
    </div>
</header>

<main>
    <div th:if="${ok}" class="alert ok" th:text="${ok}"></div>
    <div th:if="${err}" class="alert err" th:text="${err}"></div>
    <h1>Мои документы</h1>

    <form class="upload-form" method="post" th:action="@{/documents/upload}"
          enctype="multipart/form-data">
        <input type="file" name="file" required/>
        <button type="submit">Загрузить</button>
    </form>

    <div class="docs-list">
        <div th:each="d : ${documents}" class="doc-card" th:attr="data-id=${d.id}">

            <!-- Карточка документа -->
            <div class="doc-row">
                <div class="doc-name" th:text="${d.originalName}">file.pdf</div>
                <div class="doc-meta">
                    <span th:text="${#numbers.formatDecimal(d.size/1024.0,1,1)} + ' KB'">0</span>
                    <span>·</span>
                    <span th:text="${#temporals.format(d.uploadedAt,'dd.MM.yyyy HH:mm')}">—</span>
                    <span th:if="${d.signed}" class="badge ok">Подписан</span>
                    <span th:unless="${d.signed}" class="badge warn">Не подписан</span>
                </div>
                <div class="actions">
                    <a th:href="@{'/documents/' + ${d.id} + '/view'}" target="_blank" title="Просмотреть">👁</a>
                    <a th:href="@{'/documents/' + ${d.id} + '/download'}" title="Скачать">⬇</a>
                    <button type="button" class="btn-sign" th:attr="data-id=${d.id}" title="Подписать">✍</button>
                    <form method="post" th:action="@{'/documents/' + ${d.id} + '/delete'}"
                          onsubmit="return confirm('Удалить документ?')" style="display:inline">
                        <button type="submit" class="link danger" title="Удалить">🗑</button>
                    </form>
                </div>
            </div>

            <!-- Блок подписи: показывается ТОЛЬКО для подписанных документов -->
            <div th:if="${d.signed}" class="sig-block">
                <div class="sig-icon">✓</div>
                <div class="sig-info">
                    <div class="sig-title">Электронная подпись (CAdES-BES, отсоединённая)</div>
                    <div class="sig-subject" th:text="${d.signerSubject}">CN=...</div>
                    <div class="sig-meta">
                        <span th:text="'Отпечаток: ' + ${d.signerSerial}">serial</span>
                        <span>·</span>
                        <span th:text="'Подписан: ' + ${#temporals.format(d.signedAt,'dd.MM.yyyy HH:mm')}">—</span>
                    </div>
                </div>
                <div class="sig-actions">
                    <a th:href="@{'/documents/' + ${d.id} + '/signature/download'}"
                       class="btn-sig" title="Скачать подпись (.sig)">⬇ Подпись (.sig)</a>
                    <a th:href="@{'/documents/' + ${d.id} + '/download-signed'}"
                       class="btn-sig" title="Скачать документ + подпись (.zip)">📦 Документ + подпись</a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(documents)}" class="empty">
            Документов пока нет. Загрузите первый документ выше.
        </div>
    </div>
</main>

<object id="cadesplugin" type="application/x-cades"
        classid="clsid:3F367B61-B3B9-4F5A-BCD6-827DA1C5C7D2"
        style="width:0;height:0"></object>

<script type="module" th:src="@{/js/sign.js}"></script>
</body>
</html>
