<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>УКЭП Сервис · Админ · Заявки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="admin-header">
    <div class="brand">УКЭП Сервис · Админ</div>
    <nav class="admin-nav">
        <a th:href="@{/admin}">Дашборд</a>
        <a th:href="@{/admin/documents}" class="active">Заявки</a>
        <a th:href="@{/admin/users}">Клиенты</a>
    </nav>
    <form method="post" th:action="@{/admin/logout}" style="display:inline">
        <button class="btn-ghost" type="submit">Выйти</button>
    </form>
</header>

<main>
    <h1>Заявки</h1>
    <p class="muted mb-16">
        Подписано <b class="ok" th:text="${signedCount}">0</b> ·
        не подписано <b class="warn" th:text="${unsignedCount}">0</b>
    </p>

    <form method="get" th:action="@{/admin/documents}" class="filters-form">
        <input type="text" name="q" th:value="${q}"
               placeholder="Поиск: имя документа, email, ФИО"/>
        <select name="status">
            <option value="" th:selected="${status == ''}">Все статусы</option>
            <option value="signed" th:selected="${status == 'signed'}">Подписанные</option>
            <option value="unsigned" th:selected="${status == 'unsigned'}">Не подписанные</option>
        </select>
        <button type="submit">Применить</button>
        <a th:href="@{/admin/documents}" class="btn-ghost">Сбросить</a>
    </form>

    <table class="docs">
        <thead>
        <tr>
            <th>ID</th>
            <th>Документ</th>
            <th>Размер</th>
            <th>Клиент</th>
            <th>Загружен</th>
            <th>Подпись</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${documents}">
            <td th:text="${d.id}">1</td>
            <td th:text="${d.originalName}">file.pdf</td>
            <td th:text="${#numbers.formatDecimal(d.size/1024.0,1,1)} + ' KB'">0</td>
            <td>
                <a th:href="@{'/admin/users/' + ${d.owner.id}}">
                    <div th:text="${d.owner.fullName}">Иван</div>
                    <div class="muted small" th:text="${d.owner.email}">a@b.c</div>
                </a>
            </td>
            <td th:text="${#temporals.format(d.uploadedAt,'dd.MM.yyyy HH:mm')}">—</td>
            <td>
                <div th:if="${d.signed}">
                    <span class="badge ok">Подписан</span>
                    <div class="muted small"
                         th:text="${#temporals.format(d.signedAt,'dd.MM.yyyy HH:mm')}">—</div>
                    <div class="muted small" th:text="${d.signerSubject}">CN</div>
                </div>
                <span th:unless="${d.signed}" class="badge warn">Не подписан</span>
            </td>
            <td class="actions">
                <a th:href="@{'/admin/documents/' + ${d.id} + '/view'}"
                   target="_blank" title="Просмотреть">👁</a>
                <a th:href="@{'/admin/documents/' + ${d.id} + '/download'}"
                   title="Скачать документ">⬇</a>
                <a th:if="${d.signed}"
                   th:href="@{'/admin/documents/' + ${d.id} + '/signature/download'}"
                   title="Скачать подпись">📎</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(documents)}">
            <td colspan="7" class="muted center">Нет заявок по заданным условиям</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
