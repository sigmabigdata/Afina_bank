<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <div class="brand">УКЭП Сервис</div>
    <div class="user">
        <span th:text="${user.fullName}">Пользователь</span>
        <form method="post" th:action="@{/logout}" style="display:inline">
            <button class="link" type="submit">Выйти</button>
        </form>
    </div>
</header>

<main>
    <h1>Мои документы</h1>

    <form class="upload-form" method="post" th:action="@{/documents/upload}"
          enctype="multipart/form-data">
        <input type="file" name="file" required/>
        <button type="submit">Загрузить</button>
    </form>

    <table class="docs">
        <thead>
        <tr>
            <th>Название</th>
            <th>Размер</th>
            <th>Загружен</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${documents}" th:attr="data-id=${d.id}">
            <td th:text="${d.originalName}">file.pdf</td>
            <td th:text="${#numbers.formatDecimal(d.size/1024.0,1,1)} + ' KB'">0</td>
            <td th:text="${#temporals.format(d.uploadedAt,'dd.MM.yyyy HH:mm')}">—</td>
            <td>
                <span th:if="${d.signed}" class="badge ok">Подписан</span>
                <span th:unless="${d.signed}" class="badge warn">Не подписан</span>
            </td>
            <td class="actions">
                <a th:href="@{'/documents/' + ${d.id} + '/view'}" target="_blank"
                   title="Просмотреть">👁</a>
                <a th:href="@{'/documents/' + ${d.id} + '/download'}"
                   title="Скачать">⬇</a>
                <button type="button" class="btn-sign" th:attr="data-id=${d.id}"
                        title="Подписать">✍</button>
                <form method="post" th:action="@{'/documents/' + ${d.id} + '/delete'}"
                      onsubmit="return confirm('Удалить документ?')"
                      style="display:inline">
                    <button type="submit" class="link danger" title="Удалить">🗑</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(documents)}">
            <td colspan="5" class="muted center">Документов пока нет</td>
        </tr>
        </tbody>
    </table>
</main>

<!-- sign.js подключается как ES-модуль.
     Внутри он через import загружает vendor/crypto-pro-cadesplugin.js. -->
<script type="module" th:src="@{/js/sign.js}"></script>
</body>
</html>
