spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 900000        # 15 минут (меньше idle-timeout PostgreSQL)
      connection-timeout: 30000
      keepalive-time: 120000      # 2 минуты
      connection-test-query: "SELECT 1"
      pool-name: AfinaHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false    # в проде — только явные миграции
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true              # только HTTPS
        same-site: strict

app:
  storage-path: ${APP_STORAGE_PATH}
  base-url: ${APP_BASE_URL}
  admin-ip-whitelist: ${ADMIN_IP_WHITELIST}
  crl-path: ${CRL_PATH}
  admins-file: ${ADMINS_FILE}
  mail:
    mode: smtp
    from: ${MAIL_FROM}

logging:
  level:
    root: INFO
    ru.example.ukep: INFO
    com.zaxxer.hikari: WARN
    org.springframework.security: WARN
  file:
    name: /var/log/afina/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
