version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ukep
      POSTGRES_USER: ukep
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ukep}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on: [postgres]
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

volumes:
  pg_data:
